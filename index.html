<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>게임 출시 캘린더</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <h1>🎮 게임 출시 캘린더</h1>
    <p class="subtitle">국내외 신규 출시 게임을 한눈에</p>
    <p id="last-updated" class="last-updated"></p>
  </header>

  <main>
    <section class="view-toggle">
      <button id="view-calendar" class="view-toggle-btn" type="button" aria-pressed="true">📅 캘린더</button>
      <button id="view-list" class="view-toggle-btn" type="button" aria-pressed="false">📋 리스트</button>
    </section>

    <section class="search-bar">
      <div class="search-wrap">
        <input type="search" id="search-input" placeholder="게임명 검색 ( / 키)" autocomplete="off" />
        <button id="search-clear" type="button" hidden aria-label="검색어 지우기">×</button>
      </div>
    </section>

    <section class="filters">
      <label>
        카테고리:
        <select id="category-filter">
          <option value="">전체</option>
          <option value="mobile_kr">국내 모바일</option>
          <option value="pc_console_kr">국내 PC/콘솔</option>
          <option value="global_aaa">글로벌 대작</option>
          <option value="new_server">한국 MMO 신규 서버</option>
        </select>
      </label>
      <label>
        플랫폼:
        <select id="platform-filter">
          <option value="">전체</option>
          <option value="pc">PC</option>
          <option value="ps5">PlayStation 5</option>
          <option value="xbox">Xbox Series X/S</option>
          <option value="switch">Nintendo Switch</option>
          <option value="ios">iOS</option>
          <option value="android">Android</option>
        </select>
      </label>
      <label>
        기간:
        <select id="period-filter">
          <option value="30">앞으로 30일</option>
          <option value="90">앞으로 90일</option>
          <option value="180">앞으로 6개월</option>
          <option value="365" selected>앞으로 1년</option>
          <option value="0">전체</option>
        </select>
      </label>
    </section>

    <section class="quick-chips">
      <button id="chip-this-week" class="chip-btn" type="button" aria-pressed="false">이번 주 출시</button>
      <button id="chip-next-week" class="chip-btn" type="button" aria-pressed="false">다음 주 출시</button>
      <button id="chip-wishlist" class="chip-btn" type="button" aria-pressed="false">위시리스트만 보기</button>
    </section>

    <section id="calendar-view" class="calendar-view">
      <div class="calendar-header">
        <button id="calendar-prev" class="calendar-nav-btn" type="button" aria-label="이전 달">‹</button>
        <h2 id="calendar-month-label"></h2>
        <button id="calendar-next" class="calendar-nav-btn" type="button" aria-label="다음 달">›</button>
        <button id="calendar-today" class="calendar-today-btn" type="button">오늘로</button>
      </div>
      <div id="calendar-legend" class="calendar-legend">
        <span class="legend-item"><span class="legend-dot category-mobile_kr"></span>국내 모바일</span>
        <span class="legend-item"><span class="legend-dot category-pc_console_kr"></span>국내 PC/콘솔</span>
        <span class="legend-item"><span class="legend-dot category-global_aaa"></span>글로벌 대작</span>
        <span class="legend-item"><span class="legend-dot category-new_server"></span>신규 서버</span>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
      <div id="day-detail-panel" class="day-detail-panel" hidden></div>
      <p id="calendar-empty" class="empty-state empty-state--inline" hidden>이 달에는 출시 예정 게임이 없어요.</p>
    </section>

    <section id="games-list" class="games-grid">
      <p class="loading">불러오는 중...</p>
    </section>

    <div id="game-modal" class="modal-overlay" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <button class="modal-close" aria-label="닫기">×</button>
        <div id="modal-body"></div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 게임 출시 캘린더 (gcalen.com)</p>
    <p>문의: <a href="mailto:contact@gcalen.com">contact@gcalen.com</a></p>
    <p class="footer-updated">데이터 마지막 갱신: <span id="footer-updated-date">—</span></p>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
